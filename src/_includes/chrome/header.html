<!-- Unified site header. Edit freely; it appears on every page.
     The hamburger button toggles the sliding sidebar (see chrome.js). -->
<header class="site-header" data-site-chrome>
  <button class="site-hamburger" type="button" aria-label="Open menu" aria-controls="site-sidebar" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <a class="site-brand" href="./" aria-label="Imaginary Circles — home">
    <!-- Brand mark: three overlapping circles, kept simple and subtle for
         the header. Explicit width/height attributes (not just CSS) so
         Safari can't blow the inline SVG up to fill the flex row. -->
    <svg class="site-brand-mark" width="22" height="22" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="ic-rings-brand" x1="8" y1="10" x2="40" y2="40" gradientUnits="userSpaceOnUse">
          <stop stop-color="var(--chrome-accent, #5ac4ff)"/>
          <stop offset="1" stop-color="var(--chrome-accent-b, #46d2be)"/>
        </linearGradient>
      </defs>
      <circle cx="24" cy="17.5" r="13.5" stroke="var(--chrome-accent, #5ac4ff)" stroke-width="1.4" fill="var(--chrome-accent, #5ac4ff)" fill-opacity="0.07"/>
      <circle cx="18.37" cy="27.25" r="13.5" stroke="var(--chrome-accent-b, #46d2be)" stroke-width="1.4" fill="var(--chrome-accent-b, #46d2be)" fill-opacity="0.07"/>
      <circle cx="29.63" cy="27.25" r="13.5" stroke="url(#ic-rings-brand)" stroke-width="1.4" fill="var(--chrome-accent, #5ac4ff)" fill-opacity="0.07"/>
    </svg>
    <span class="site-brand-name">Imaginary <b>Circles</b></span>
  </a>
  <a class="site-header-link" href="https://github.com/rondomingue/imaginarycircles">Source</a>
</header>
