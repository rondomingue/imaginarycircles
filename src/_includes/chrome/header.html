<!-- Unified site header. Edit freely; it appears on every page.
     The hamburger button toggles the sliding sidebar (see chrome.js). -->
<header class="site-header" data-site-chrome>
  <button class="site-hamburger" type="button" aria-label="Open menu" aria-controls="site-sidebar" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <a class="site-brand" href="./" aria-label="Imaginary Circles — home">
    <!-- Brand mark: three overlapping circles (matches the animated hero mark). -->
    <svg class="site-brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="ic-rings-brand" x1="8" y1="10" x2="40" y2="40" gradientUnits="userSpaceOnUse">
          <stop stop-color="var(--chrome-accent, #5ac4ff)"/>
          <stop offset="1" stop-color="var(--chrome-accent-b, #46d2be)"/>
        </linearGradient>
      </defs>
      <line x1="2" y1="24" x2="46" y2="24" stroke="var(--chrome-accent, #5ac4ff)" stroke-opacity="0.2" stroke-width="0.8" stroke-dasharray="0.5 3" stroke-linecap="round"/>
      <line x1="24" y1="2" x2="24" y2="46" stroke="var(--chrome-accent, #5ac4ff)" stroke-opacity="0.2" stroke-width="0.8" stroke-dasharray="0.5 3" stroke-linecap="round"/>
      <path d="M24 17.5 L18.37 27.25 L29.63 27.25 Z" stroke="var(--chrome-accent, #5ac4ff)" stroke-opacity="0.42" stroke-width="0.8" stroke-dasharray="1.6 2.4" stroke-linejoin="round"/>
      <circle cx="24" cy="17.5" r="13.5" stroke="var(--chrome-accent, #5ac4ff)" stroke-width="1.1" fill="var(--chrome-accent, #5ac4ff)" fill-opacity="0.09"/>
      <circle cx="18.37" cy="27.25" r="13.5" stroke="var(--chrome-accent-b, #46d2be)" stroke-width="1.1" fill="var(--chrome-accent-b, #46d2be)" fill-opacity="0.09"/>
      <circle cx="29.63" cy="27.25" r="13.5" stroke="url(#ic-rings-brand)" stroke-width="1.1" fill="var(--chrome-accent, #5ac4ff)" fill-opacity="0.09"/>
      <circle cx="24" cy="17.5" r="1.25" fill="var(--chrome-accent, #5ac4ff)"/>
      <circle cx="18.37" cy="27.25" r="1.25" fill="var(--chrome-accent-b, #46d2be)"/>
      <circle cx="29.63" cy="27.25" r="1.25" fill="var(--chrome-accent-b, #46d2be)"/>
      <circle cx="24" cy="24" r="1.4" fill="var(--chrome-ink, #e7edf3)"/>
    </svg>
    <span class="site-brand-name">Imaginary <b>Circles</b></span>
  </a>
  <a class="site-header-link" href="https://github.com/rondomingue/imaginarycircles">Source</a>
</header>
